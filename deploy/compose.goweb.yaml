name: voice-go

services:
  voice-go:
    build:
      context: ..
      dockerfile: Dockerfile.goweb
    image: ${VOICE_GO_IMAGE:-voice-go:current}
    container_name: voice-go
    restart: unless-stopped
    network_mode: host
    environment:
      VOICE_WEB_ROOT: /opt/voice-changer/web
      VOICE_WEB_ADDR: 192.168.20.70:8080
      VOICE_ROUTE_CONFIG_FILE: /etc/voice-changer/voice-routing.json
      VOICE_ADMIN_PASSWORD_FILE: /run/secrets/voice-admin-password
      VOICE_ADMIN_ORIGIN: https://voice.lan.awesomeio.ru,https://vm-voice-1.lan.awesomeio.ru
      VOICE_ARI_URL: http://127.0.0.1:8092/ari
      VOICE_ARI_USERNAME: phoneguy
      VOICE_ARI_PASSWORD_FILE: /run/secrets/ari-password
      VOICE_RVC_URL: ws://127.0.0.1:8090/ws/rvc-v2
      VOICE_SELFMONITOR_ARI_APP: ${VOICE_SELFMONITOR_ARI_APP:-selfmonitor}
      VOICE_SELFMONITOR_HEALTH_ADDR: ${VOICE_SELFMONITOR_HEALTH_ADDR:-127.0.0.1:8096}
      VOICE_SELFMONITOR_PUBLISHER_ADDR: ${VOICE_SELFMONITOR_PUBLISHER_ADDR:-127.0.0.1:8097}
      CONFERENCE_FIXTURE_DIR: /var/lib/voice-changer/conference-fixtures
    volumes:
      - /etc/voice-changer:/etc/voice-changer:rw
      - /etc/voice-changer-admin/password:/run/secrets/voice-admin-password:ro
      - "${VOICE_ARI_RUNTIME:?VOICE_ARI_RUNTIME is required}/asterisk/ari-password:/run/secrets/ari-password:ro"
      - "${VOICE_CONFERENCE_FIXTURES:?VOICE_CONFERENCE_FIXTURES is required}:/var/lib/voice-changer/conference-fixtures:ro"
    mem_limit: 512m
    cpus: 2.0
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
