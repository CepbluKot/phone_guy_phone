<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phone Line</title><link rel="stylesheet" href="/static/style.css"></head>
<body><main><p class="eyebrow">PRIVATE VPN VOICE LAB</p><h1>PHONE LINE</h1><p id="status">Готов к подключению микрофона</p><div class="controls"><button id="start">Начать</button><button id="stop" disabled>Остановить</button></div>
<label>Pitch <input id="pitch" type="range" min="-6" max="6" value="-1.5" step="0.5"></label><label>Эффект <input id="effect" type="range" min="0" max="1" value="0.85" step="0.05"></label><label>Шум линии <input id="noise" type="range" min="0" max="0.15" value="0.04" step="0.01"></label><label>Громкость <input id="gain" type="range" min="-18" max="12" value="0" step="1"></label><p id="latency">Задержка: —</p></main><script src="/static/app.js"></script></body></html>
