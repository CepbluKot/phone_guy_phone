[phoneguy]
exten => demo,1,Answer()
 same => n,ConfBridge(phoneguy-demo,phoneguy_bridge,phoneguy_user)
 same => n,Hangup()

; Every real SIP participant enters the controller at one explicit number.
; The controller decides whether that endpoint is original or Phone Guy.
[phoneguy-sip]
exten => 600,1,Stasis(phoneguy-sip)
 same => n,Hangup()
; Cached RVC output: this listener bot does not acquire the live GPU worker.
exten => 1987,1,Answer()
 same => n(play),Playback(phoneguy-bot/phoneguy)
 same => n,GotoIf($["${PLAYBACKSTATUS}" = "SUCCESS"]?pause:done)
 same => n(pause),Wait(2)
 same => n,Goto(play)
 same => n(done),Hangup()
; Bite of '83: five seconds of the Night 5 call followed by the scary soundtrack.
exten => 1983,1,Answer()
 same => n(play),Playback(phoneguy-bot/night5-then-scary)
 same => n,GotoIf($["${PLAYBACKSTATUS}" = "SUCCESS"]?play:done)
 same => n(done),Hangup()
; FNaF release year: user-provided Mr Beast Rizz, converted by Phone Guy v2.
exten => 2014,1,Answer()
 same => n(play),Playback(phoneguy-bot/mr-beast-phoneguy)
 same => n,GotoIf($["${PLAYBACKSTATUS}" = "SUCCESS"]?pause:done)
 same => n(pause),Wait(2)
 same => n,Goto(play)
 same => n(done),Hangup()
