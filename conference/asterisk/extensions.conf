[phoneguy]
exten => demo,1,Answer()
 same => n,ConfBridge(phoneguy-demo,phoneguy_bridge,phoneguy_user)
 same => n,Hangup()

[phoneguy-sip]
; Preserve the rendered browser stream on 1999; it never captures SIP audio.
exten => 1999,1,Stasis(selfmonitor)
 same => n,Hangup()

; All real endpoint calls enter Go before Asterisk can establish an audible path.
; CHANNEL(endpoint) is the trusted PJSIP endpoint identity, never caller ID.
exten => 600,1,Set(PHONEGUY_SOURCE=${CHANNEL(endpoint)})
 same => n,Stasis(voice-control,source=${PHONEGUY_SOURCE},peer=conference)
 same => n,Hangup()

; Preserve the callback destination while letting the Go bridge enforce the role.
exten => 1900,1,Set(PHONEGUY_SOURCE=${CHANNEL(endpoint)})
 same => n,Stasis(voice-control,source=${PHONEGUY_SOURCE},peer=1983,mode=callback-1900)
 same => n,Hangup()

; The phone endpoint's SIP digest authentication grants this context. Accept
; 11-digit Russian numbers entered with 7 or 8, prepend 701 to select FXO1,
; and send them as 8 + ten digits to the analog line. Keep before Go/ARI; never
; authorize by caller ID.
; BEGIN NATEKS PSTN OUTBOUND
exten => _7XXXXXXXXXX,1,Set(NATEKS_SOURCE=${CHANNEL(endpoint)})
 same => n,GotoIf($["${NATEKS_SOURCE}"=""]?unauthorized)
 same => n,Set(NATEKS_NUMBER=8${EXTEN:1})
 same => n,Dial(PJSIP/701${NATEKS_NUMBER}@nateks-fxo,60)
 same => n,Hangup()
 same => n(unauthorized),Hangup(21)
exten => _8XXXXXXXXXX,1,Set(NATEKS_SOURCE=${CHANNEL(endpoint)})
 same => n,GotoIf($["${NATEKS_SOURCE}"=""]?unauthorized)
 same => n,Set(NATEKS_NUMBER=8${EXTEN:1})
 same => n,Dial(PJSIP/701${NATEKS_NUMBER}@nateks-fxo,60)
 same => n,Hangup()
 same => n(unauthorized),Hangup(21)
; END NATEKS PSTN OUTBOUND

; All dialed extensions, including old demo/playback numbers, go through Go's
; current physical-phone and active-browser allowlist before a call can bridge.
exten => _X.,1,Set(PHONEGUY_SOURCE=${CHANNEL(endpoint)})
 same => n,Stasis(voice-control,source=${PHONEGUY_SOURCE},peer=${EXTEN})
 same => n,Hangup()

; This context is reachable only after a separately authenticated Nateks PJSIP
; endpoint is configured in the runtime-owned include. It bypasses Go/RVC and
; has one fixed destination, so a city-line call cannot ring a group.
[nateks-inbound]
exten => s,1,NoOp(Authenticated Nateks FXO inbound call)
 same => n,Dial(PJSIP/2015,30)
 same => n,Hangup()
exten => _X.,1,Goto(s,1)
