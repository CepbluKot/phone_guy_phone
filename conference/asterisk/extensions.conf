[phoneguy]
exten => demo,1,Answer()
 same => n,ConfBridge(phoneguy-demo,phoneguy_bridge,phoneguy_user)
 same => n,Hangup()

[phoneguy-sip]
; Preserve the rendered browser stream on 1999; it never captures SIP audio.
exten => 1999,1,Stasis(selfmonitor)
 same => n,Hangup()

; All real endpoint calls enter Go before Asterisk can establish an audible path.
; CHANNEL(endpoint) is the trusted PJSIP endpoint identity, never caller ID.
exten => 600,1,Set(PHONEGUY_SOURCE=${CHANNEL(endpoint)})
 same => n,Stasis(voice-control,source=${PHONEGUY_SOURCE},peer=conference)
 same => n,Hangup()

; Preserve the callback destination while letting the Go bridge enforce the role.
exten => 1900,1,Set(PHONEGUY_SOURCE=${CHANNEL(endpoint)})
 same => n,Stasis(voice-control,source=${PHONEGUY_SOURCE},peer=1983,mode=callback-1900)
 same => n,Hangup()

; Admit the one-way recording services in Go, then continue to their fixed
; cached playback loops. These calls never bridge caller speech to a phone.
exten => 1987,1,Answer()
 same => n,Set(PHONEGUY_SOURCE=${CHANNEL(endpoint)})
 same => n,Stasis(voice-control,source=${PHONEGUY_SOURCE},service=1987)
 same => n,Hangup()
 same => n(play),Playback(phoneguy-bot/phoneguy)
 same => n,GotoIf($["${PLAYBACKSTATUS}" = "SUCCESS"]?pause:done)
 same => n(pause),Wait(2)
 same => n,Goto(play)
 same => n(done),Hangup()

exten => 2014,1,Answer()
 same => n,Set(PHONEGUY_SOURCE=${CHANNEL(endpoint)})
 same => n,Stasis(voice-control,source=${PHONEGUY_SOURCE},service=2014)
 same => n,Hangup()
 same => n(play),Playback(phoneguy-bot/mr-beast-phoneguy)
 same => n,GotoIf($["${PLAYBACKSTATUS}" = "SUCCESS"]?pause:done)
 same => n(pause),Wait(2)
 same => n,Goto(play)
 same => n(done),Hangup()

exten => 1993,1,Answer()
 same => n,Set(PHONEGUY_SOURCE=${CHANNEL(endpoint)})
 same => n,Stasis(voice-control,source=${PHONEGUY_SOURCE},service=1993)
 same => n,Hangup()
 same => n(play),Playback(phoneguy-bot/fnaf1-night1-original)
 same => n,GotoIf($["${PLAYBACKSTATUS}" = "SUCCESS"]?pause:done)
 same => n(pause),Wait(2)
 same => n,Goto(play)
 same => n(done),Hangup()

; Reject unknown endpoints in Go before native Dial/ConfBridge can expose media.
exten => _X.,1,Set(PHONEGUY_SOURCE=${CHANNEL(endpoint)})
 same => n,Stasis(voice-control,source=${PHONEGUY_SOURCE},peer=${EXTEN})
 same => n,Hangup()
